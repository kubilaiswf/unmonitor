  <use href="#cursor" x="536" y="118" fill="#3fb950"/>

  <g fill="#8b949e" font-size="13" text-anchor="middle">
    <text x="95" y="192">Monitor</text>
    <text x="255" y="192">Soundbar (hidden screen)</text>
    <text x="475" y="192">Monitor</text>
    <text x="635" y="192">Soundbar (hidden screen)</text>
  </g>
  <g fill="#8b949e" font-size="14" text-anchor="middle">
