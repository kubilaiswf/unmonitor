<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <path id="cursor" d="M0 0 L0 17 L4.5 13 L7.5 20 L10 19 L7 12 L12.5 12 Z"/>
